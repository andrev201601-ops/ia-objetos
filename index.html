<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>IA-Objetos</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #202124;
}

/* =========================
   INTERFAZ ORIGINAL
========================= */

#desktop {
  min-height: 100vh;
}

header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #4285f4;
}

.desktop-content {
  max-width: 700px;
  margin: auto;
  padding: 35px 20px;
  text-align: center;
}

.robot {
  font-size: 75px;
}

.desktop-content h1 {
  font-size: 40px;
  margin: 10px 0;
}

.desktop-content p {
  color: #666;
  font-size: 17px;
}

.main-button {
  width: 100%;
  min-height: 62px;

  border: none;
  border-radius: 18px;

  margin-top: 13px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.blue {
  background: #4285f4;
  color: white;
}

.green {
  background: #34a853;
  color: white;
}

.gray {
  background: #e8eaed;
  color: #202124;
}

.dark {
  background: #202124;
  color: white;
}

/* BOTÓN MÓVIL */

.mobile-entry {
  margin-top: 30px;

  background: linear-gradient(
    135deg,
    #4285f4,
    #6c5ce7
  );

  color: white;

  border: none;
  border-radius: 25px;

  width: 100%;
  min-height: 90px;

  font-size: 22px;
  font-weight: bold;

  box-shadow:
    0 8px 25px rgba(66,133,244,.25);

  cursor: pointer;
}

.mobile-entry:active {
  transform: scale(.98);
}


/* =========================
   INTERFAZ MÓVIL
========================= */

#mobile {
  display: none;

  min-height: 100vh;

  background:
    linear-gradient(
      180deg,
      #111827 0%,
      #1f2937 100%
    );

  color: white;
}


/* CABECERA MÓVIL */

.mobile-header {
  height: 70px;

  display: flex;
  align-items: center;

  justify-content: space-between;

  padding: 0 16px;

  background: rgba(0,0,0,.35);

  position: sticky;
  top: 0;

  z-index: 100;
}

.mobile-title {
  font-size: 21px;
  font-weight: bold;
}

.back-button {
  border: none;

  background: rgba(255,255,255,.12);

  color: white;

  border-radius: 14px;

  padding: 11px 15px;

  font-size: 14px;
  font-weight: bold;
}


/* CONTENIDO */

.mobile-content {
  padding: 18px 15px 35px;
}


/* TARJETAS */

.mobile-card {
  background: rgba(255,255,255,.09);

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 22px;

  padding: 18px;

  margin-bottom: 15px;
}

.mobile-card h2 {
  margin-top: 0;
}


/* BOTONES */

.mobile-button {
  width: 100%;

  min-height: 60px;

  border: none;

  border-radius: 17px;

  margin-top: 10px;

  font-size: 16px;

  font-weight: bold;
}


/* CÁMARA */

.camera-box {
  width: 100%;

  aspect-ratio: 3 / 4;

  background: black;

  border-radius: 24px;

  overflow: hidden;

  position: relative;

  margin-top: 15px;
}

#video {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: none;
}

.camera-message {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;

  color: #aaa;
}


/* RESULTADO */

.result {
  margin-top: 15px;

  padding: 17px;

  border-radius: 19px;

  background: rgba(255,255,255,.1);
}

.result-title {
  font-size: 13px;
  color: #aaa;
}

.result-name {
  font-size: 29px;
  font-weight: bold;

  margin-top: 4px;
}

.result-confidence {
  color: #9ca3af;

  margin-top: 4px;
}


/* PREDICCIONES */

.predictions {
  margin-top: 15px;
}

.prediction {
  margin-bottom: 12px;
}

.prediction-top {
  display: flex;
  justify-content: space-between;

  font-size: 14px;
}

.progress {
  height: 8px;

  background: rgba(255,255,255,.12);

  border-radius: 20px;

  overflow: hidden;

  margin-top: 5px;
}

.progress-bar {
  height: 100%;

  width: 0%;

  background: #4285f4;

  transition: width .15s;
}


/* INPUT */

.mobile-input {
  width: 100%;

  height: 55px;

  border: none;

  border-radius: 14px;

  padding: 0 14px;

  font-size: 14px;

  outline: none;
}


/* ESTADO */

.mobile-status {
  text-align: center;

  color: #9ca3af;

  font-size: 13px;

  margin: 12px 0;
}


/* OCULTO */

.hidden {
  display: none !important;
}
</style>
</head>


<body>


<!-- =====================================================
     INTERFAZ ORIGINAL
===================================================== -->

<div id="desktop">

  <header>

    <div class="logo">
      IA-<span>Objetos</span>
    </div>

    <div>
      IA
    </div>

  </header>


  <main class="desktop-content">

    <div class="robot">
      🤖
    </div>

    <h1>
      IA-<span style="color:#4285f4">
        Objetos
      </span>
    </h1>

    <p>
      Entrena y utiliza inteligencia artificial
      para reconocer objetos.
    </p>


    <button
      class="main-button blue"
      onclick="crearIA()">

      ✨ Crear IA

    </button>


    <button
      class="main-button green"
      onclick="abrirModelo()">

      🧠 Mi modelo

    </button>


    <!-- NUEVO BOTÓN -->

    <button
      class="mobile-entry"
      onclick="entrarMovil()">

      📱 MODO MÓVIL

      <br>

      <small style="font-size:13px">
        Reconocimiento optimizado para teléfonos
      </small>

    </button>

  </main>

</div>



<!-- =====================================================
     INTERFAZ MÓVIL
===================================================== -->

<div id="mobile">


  <!-- HEADER -->

  <div class="mobile-header">

    <button
      class="back-button"
      onclick="salirMovil()">

      ← Volver

    </button>

    <div class="mobile-title">
      📱 IA-Objetos
    </div>

    <div>
      🤖
    </div>

  </div>



  <!-- CONTENIDO -->

  <main class="mobile-content">


    <!-- MODELO -->

    <div class="mobile-card">

      <h2>
        🧠 Modelo de IA
      </h2>

      <p style="color:#aaa">
        Conecta tu modelo de Teachable Machine.
      </p>

      <input
        id="modelURL"
        class="mobile-input"
        placeholder="https://teachablemachine.withgoogle.com/models/..."
      >

      <button
        class="mobile-button green"
        onclick="cargarModelo()">

        🧠 Cargar modelo

      </button>

    </div>



    <!-- CÁMARA -->

    <div class="mobile-card">

      <h2>
        📷 Reconocimiento
      </h2>

      <div class="camera-box">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <div
          id="cameraMessage"
          class="camera-message">

          Pulsa
          <b>“Iniciar cámara”</b>
          para comenzar.

        </div>

      </div>


      <button
        class="mobile-button blue"
        onclick="iniciarCamara()">

        📷 Iniciar cámara

      </button>


      <button
        class="mobile-button gray"
        onclick="cambiarCamara()">

        🔄 Cambiar cámara

      </button>


      <button
        class="mobile-button"
        style="background:#ef4444;color:white"
        onclick="detenerCamara()">

        ⏹ Detener

      </button>

    </div>



    <!-- RESULTADO -->

    <div class="mobile-card">

      <h2>
        🎯 Resultado
      </h2>

      <div class="result">

        <div class="result-title">
          Objeto detectado
        </div>

        <div
          id="resultName"
          class="result-name">

          Esperando...

        </div>

        <div
          id="resultConfidence"
          class="result-confidence">

          0%

        </div>

      </div>


      <div
        id="predictions"
        class="predictions">
      </div>

    </div>



    <!-- INFORMACIÓN -->

    <div class="mobile-card">

      <h2>
        ℹ️ Estado
      </h2>

      <div
        id="mobileStatus"
        class="mobile-status">

        Sin modelo

      </div>

    </div>

  </main>

</div>



<script>

/* =====================================================
   VARIABLES
===================================================== */

let model = null;

let stream = null;

let running = false;

let facingMode = "environment";

let predictionLoop = null;

let classCount = 0;


/* =====================================================
   ENTRAR AL MODO MÓVIL
===================================================== */

function entrarMovil() {

  document
    .getElementById("desktop")
    .style.display = "none";

  document
    .getElementById("mobile")
    .style.display = "block";

  window.scrollTo(0, 0);

}


/* =====================================================
   SALIR
===================================================== */

function salirMovil() {

  detenerCamara();

  document
    .getElementById("mobile")
    .style.display = "none";

  document
    .getElementById("desktop")
    .style.display = "block";

}


/* =====================================================
   CREAR IA
===================================================== */

function crearIA() {

  window.open(
    "https://teachablemachine.withgoogle.com/train",
    "_blank"
  );

}


/* =====================================================
   ABRIR MODELO
===================================================== */

function abrirModelo() {

  entrarMovil();

}


/* =====================================================
   NORMALIZAR URL
===================================================== */

function normalizarURL(url) {

  url = url.trim();

  if (!url) {

    throw new Error(
      "Escribe la URL del modelo."
    );

  }


  if (
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ) {

    url =
      "https://teachablemachine.withgoogle.com/models/" +
      url;

  }


  url = url
    .replace(/\/model\.json\/?$/i, "")
    .replace(/\/metadata\.json\/?$/i, "")
    .replace(/\/+$/, "");


  if (
    !url.includes(
      "teachablemachine.withgoogle.com/models/"
    )
  ) {

    throw new Error(
      "La URL no parece ser un modelo válido."
    );

  }


  return url + "/";

}


/* =====================================================
   CARGAR MODELO
===================================================== */

async function cargarModelo() {

  const input =
    document.getElementById("modelURL");

  const status =
    document.getElementById("mobileStatus");


  try {

    const baseURL =
      normalizarURL(input.value);


    status.textContent =
      "⏳ Cargando modelo...";


    model =
      await tmImage.load(
        baseURL + "model.json",
        baseURL + "metadata.json"
      );


    classCount =
      model.getTotalClasses();


    crearBarras();


    status.textContent =
      "✅ Modelo cargado. " +
      classCount +
      " clases encontradas.";


  } catch(error) {

    model = null;


    status.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =====================================================
   CREAR BARRAS
===================================================== */

function crearBarras() {

  const container =
    document.getElementById(
      "predictions"
    );


  container.innerHTML = "";


  for (
    let i = 0;
    i < classCount;
    i++
  ) {

    const item =
      document.createElement("div");

    item.className =
      "prediction";


    item.innerHTML = `

      <div class="prediction-top">

        <span id="label-${i}">
          Clase
        </span>

        <span id="percent-${i}">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="bar-${i}"
          class="progress-bar">
        </div>

      </div>

    `;


    container.appendChild(item);

  }

}


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara() {

  if (!model) {

    document.getElementById(
      "mobileStatus"
    ).textContent =
      "⚠️ Primero carga un modelo.";

    return;

  }


  detenerCamara();


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: facingMode
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    video.style.display =
      "block";


    document.getElementById(
      "cameraMessage"
    ).style.display =
      "none";


    await video.play();


    running = true;


    document.getElementById(
      "mobileStatus"
    ).textContent =
      "🟢 Cámara activa";


    predecir();


  } catch(error) {

    document.getElementById(
      "mobileStatus"
    ).textContent =
      "❌ No se pudo abrir la cámara: " +
      error.message;

  }

}


/* =====================================================
   RECONOCIMIENTO
===================================================== */

async function predecir() {

  if (
    !running ||
    !model
  ) {

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  try {

    const predictions =
      await model.predict(
        video
      );


    let best =
      predictions[0];


    for (
      let i = 1;
      i < predictions.length;
      i++
    ) {

      if (
        predictions[i].probability >
        best.probability
      ) {

        best =
          predictions[i];

      }

    }


    const confidence =
      best.probability * 100;


    document.getElementById(
      "resultName"
    ).textContent =
      best.className;


    document.getElementById(
      "resultConfidence"
    ).textContent =
      confidence.toFixed(1) +
      "% de confianza";


    for (
      let i = 0;
      i < predictions.length;
      i++
    ) {

      const percent =
        predictions[i].probability *
        100;


      const label =
        document.getElementById(
          "label-" + i
        );

      const percentText =
        document.getElementById(
          "percent-" + i
        );

      const bar =
        document.getElementById(
          "bar-" + i
        );


      if (label)
        label.textContent =
          predictions[i].className;


      if (percentText)
        percentText.textContent =
          percent.toFixed(1) + "%";


      if (bar)
        bar.style.width =
          percent + "%";

    }

  } catch(error) {

    console.log(
      "Error de reconocimiento:",
      error
    );

  }


  if (running) {

    predictionLoop =
      requestAnimationFrame(
        predecir
      );

  }

}


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

async function cambiarCamara() {

  if (facingMode === "environment") {

    facingMode = "user";

  } else {

    facingMode = "environment";

  }


  await iniciarCamara();

}


/* =====================================================
   DETENER
===================================================== */

function detenerCamara() {

  running = false;


  if (predictionLoop) {

    cancelAnimationFrame(
      predictionLoop
    );

    predictionLoop = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject = null;

    video.style.display =
      "none";

  }


  const message =
    document.getElementById(
      "cameraMessage"
    );


  if (message) {

    message.style.display =
      "flex";

  }


  document.getElementById(
    "mobileStatus"
  ).textContent =
    model
      ? "🧠 Modelo listo"
      : "Sin modelo";

}


/* =====================================================
   EVITAR QUE LA CÁMARA QUEDE ENCENDIDA
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      running
    ) {

      detenerCamara();

    }

  }
);


/* =====================================================
   COMPROBAR LIBRERÍAS
===================================================== */

window.addEventListener(
  "load",
  () => {

    if (
      typeof tf === "undefined"
    ) {

      console.error(
        "TensorFlow.js no cargó."
      );

    }


    if (
      typeof tmImage === "undefined"
    ) {

      console.error(
        "Teachable Machine no cargó."
      );

    }

  }
);

</script>

</body>
</html>
